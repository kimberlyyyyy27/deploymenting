<script>
  // Keep the static shell visible if React/Babel/CDN startup fails.
  window.__rewearReactStarted = false;
  window.addEventListener('error', function() {
    if (!window.__rewearReactStarted) {
      var shell = document.getElementById('preview-shell');
      if (shell) shell.style.display = 'block';
      var msg = document.getElementById('preview-error');
      if (!msg) {
        msg = document.createElement('p');
        msg.id = 'preview-error';
        msg.style.cssText = 'margin:16px 0 0;padding:12px;border-radius:8px;background:#fff4d8;color:#684d12;font-size:13px;';
        msg.textContent = 'Interactive mode could not start in this preview. The static REWEAR preview is still available.';
        var main = shell && shell.querySelector('main');
        if (main) main.appendChild(msg);
      }
    }
  });
</script>

/* =========================================================
   SAFE STORAGE
   ========================================================= */
function readStorage(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed ?? fallback;
  } catch {
    return fallback;
  }
}

function useStored(key, initial) {
  const [value,setValue] = useState(() => readStorage(key, initial));
  const previousKey = useRef(key);

  useEffect(() => {
    if (previousKey.current !== key) {
      previousKey.current = key;
      setValue(readStorage(key, initial));
      return;
    }
    try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
  }, [key,value]);

  return [value,setValue];
}

/* =========================================================

function Button({children,className='',variant='primary',...props}) {
  return <button className={`btn ${variant==='primary'?'primary':'secondary'} ${className}`} {...props}>{children}</button>;
}
function ModalShell({children,onClose,wide=false,xwide=false}) {
  return <div className="backdrop" onMouseDown={e => {if(e.target===e.currentTarget)onClose();}}>
    <div className={`modal ${wide?'wide':''} ${xwide?'xwide':''}`}>{children}</div>
  </div>;
}
function ModalTitle({title,onClose}) {
  return <div className="modal-title"><h2>{title}</h2><button className="close" onClick={onClose}><Icon name="X"/></button></div>;
}
function Toast({message}) {
  return message ? <div className="toast"><Icon name="Check" size={16}/>{message}</div> : null;
}
function Countdown({minutes=5,seconds=32}) { const [left,setLeft]=useState(minutes*60+seconds); useEffect(()=>{const id=window.setInterval(()=>setLeft(v=>v>0?v-1:minutes*60+seconds),1000);return()=>window.clearInterval(id)},[minutes,seconds]); const m=String(Math.floor(left/60)).padStart(2,'0'),s=String(left%60).padStart(2,'0'); return <div className="countdown"><span>Berakhir dalam</span><span className="timebox">{m}</span>:<span className="timebox">{s}</span></div>}
function SkeletonGrid() {
  return <div className="grid">{Array.from({length:5}).map((_,i)=><div className="product" key={i}>

function ChatModal({rooms,setRooms,onClose,onRead}) {
  const [selected,setSelected]=useState(rooms[0]?.id||'helper');
  const [draft,setDraft]=useState('');
  const room=rooms.find(r=>r.id===selected)||rooms[0];
  const send=e=>{
    e.preventDefault();const text=draft.trim();if(!text)return;
    setRooms(rs=>rs.map(r=>r.id===room.id?{...r,messages:[...r.messages,{id:Date.now(),sender:'user',text,read:true}]}:r));setDraft('');
  };
  const choose=id=>{setSelected(id);setRooms(rs=>rs.map(r=>r.id===id?{...r,messages:r.messages.map(m=>({...m,read:true}))}:r));onRead();};
  return <ModalShell onClose={onClose} xwide><ModalTitle title="Ruang Chat" onClose={onClose}/><div className="chat-layout">
    <aside className="chat-rooms"><strong>Percakapan</strong>{rooms.map(r=><button className={`chat-room ${r.id===room.id?'active':''}`} key={r.id} onClick={()=>choose(r.id)}><span className="chat-icon"><Icon name="MessageCircle" size={15}/></span><span><b>{r.name}</b><small>{r.kind==='helper'?'Bantuan Rewear':'Toko'}{r.messages.some(m=>m.sender==='other'&&!m.read)?' · Baru':''}</small></span></button>)}</aside>
    <section className="chat-thread"><div className="chat-head"><Icon name="MessageCircle" size={16}/><strong>{room.name}</strong></div><div className="messages">{room.messages.map(m=><div className={`message ${m.sender}`} key={m.id}>{m.text}</div>)}</div><form className="chat-form" onSubmit={send}><input value={draft} onChange={e=>setDraft(e.target.value)} placeholder={`Pesan untuk ${room.name}...`}/><Button><Icon name="ArrowRight" size={16}/></Button></form></section>
  </div></ModalShell>
}

/* =========================================================
   SELLER MODE
   ========================================================= */
function SellerDashboard({products,user,onClose,onSaveProduct}) {
  const sellerName=user?.name||'Seller Rewear';
  const sellerStore=user?.storeName||sellerName;
  const sellerProducts=products.filter(p=>p.storeName===sellerStore);
  const [editing,setEditing]=useState(null);
  const blank={name:'',price:'',category:'Atasan',stock:1,brand:'',condition:'Like New',material:'',measurements:'',location:'Jakarta Selatan',originalPrice:''};
  const [draft,setDraft]=useState(blank);
  const openNew=()=>{setDraft({...blank,brand:sellerName,location:'Jakarta Selatan'});setEditing('new')};
  const openEdit=p=>{setDraft({...p,price:String(p.price),originalPrice:String(p.originalPrice),stock:Math.min(1,p.stock||1)});setEditing(p.id)};
  const save=e=>{e.preventDefault();if(!draft.name.trim()||!draft.price)return;
    onSaveProduct({...draft,id:editing==='new'?`seller-${Date.now()}`:editing,price:Number(draft.price),originalPrice:Number(draft.originalPrice||draft.price),stock:1,isSold:false,brand:draft.brand||sellerName,storeName:sellerStore,condition:draft.condition||'Like New',location:draft.location||'Jakarta Selatan',viewed:0,sold:editing==='new'?0:(products.find(p=>p.id===editing)?.sold||0),sellerRating:5,material:draft.material||'Belum diisi',measurements:draft.measurements||'Belum diisi',photos:[images.floral],ribbon:'Baru'});setEditing(null);};
  return <ModalShell onClose={onClose} xwide><ModalTitle title="Seller Mode" onClose={onClose}/><div className="seller-dashboard">
    <span className="eyebrow blue">TOKO KAMU</span><h2 style={{margin:'8px 0 0'}}>{sellerStore}</h2>
    <div className="seller-cards"><div className="seller-card">Produk Aktif<strong>{sellerProducts.filter(p=>p.stock>0).length}</strong></div><div className="seller-card">Terjual<strong>{sellerProducts.reduce((s,p)=>s+p.sold,0)}</strong></div><div className="seller-card">Estimasi Penjualan<strong>{formatPrice(sellerProducts.reduce((s,p)=>s+p.price*p.sold,0))}</strong></div></div>
    <div className="seller-actions"><Button onClick={openNew}><Icon name="Plus"/>Upload Produk</Button><Button variant="secondary">Lihat Penjualan</Button><Button variant="secondary">Kelola Toko</Button></div>
    <div style={{marginTop:25}}><h3>Produk</h3>{sellerProducts.length===0?<div className="empty"><p>Belum ada produk. Upload produk pertama kamu.</p></div>:sellerProducts.map(p=><div key={p.id} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 0',borderBottom:'1px solid var(--line)'}}><img src={p.photos[0]} style={{width:48,height:58,objectFit:'cover',borderRadius:6}}/><span style={{flex:1}}><b>{p.name}</b><small style={{display:'block',color:'#888'}}>{formatPrice(p.price)} · {p.stock>0?'stok 1':'Sold Out'}</small></span><Button variant="secondary" onClick={()=>openEdit(p)}>Edit</Button></div>)}</div>
    {editing&&<div className="inner-overlay"><div className="modal inner-modal"><ModalTitle title={editing==='new'?'Upload Produk':'Edit Produk'} onClose={()=>setEditing(null)}/><form className="form" onSubmit={save}><input required placeholder="Nama produk" value={draft.name} onChange={e=>setDraft({...draft,name:e.target.value})}/><input placeholder="Brand" value={draft.brand} onChange={e=>setDraft({...draft,brand:e.target.value})}/><div className="form-grid"><label>Harga<input required type="number" min="0" value={draft.price} onChange={e=>setDraft({...draft,price:e.target.value})}/></label><label>Harga asli<input type="number" min="0" value={draft.originalPrice} onChange={e=>setDraft({...draft,originalPrice:e.target.value})}/></label></div><select value={draft.category} onChange={e=>setDraft({...draft,category:e.target.value})}>{categories.slice(1,6).map(c=><option key={c}>{c}</option>)}</select><select value={draft.condition} onChange={e=>setDraft({...draft,condition:e.target.value})}>{conditions.slice(1).map(c=><option key={c}>{c}</option>)}</select><input placeholder="Material" value={draft.material} onChange={e=>setDraft({...draft,material:e.target.value})}/><input placeholder="Pengukuran" value={draft.measurements} onChange={e=>setDraft({...draft,measurements:e.target.value})}/><input placeholder="Lokasi" value={draft.location} onChange={e=>setDraft({...draft,location:e.target.value})}/><Button className="full">Simpan Produk</Button></form></div></div>}
  </div></ModalShell>
}
/* =========================================================
   ORDERS + STORE + CONFIRMATION
   ========================================================= */
function OrdersModal({orders,onClose}) {
  return <ModalShell onClose={onClose}><ModalTitle title="Pesanan Saya" onClose={onClose}/><div className="orders-body">{!orders.length?<div className="empty"><Icon name="Package" size={42}/><h3>Belum ada pesanan</h3><p>Pesanan demo kamu akan muncul di sini.</p></div>:orders.map(o=><article className="order-card" key={o.id}><div className="order-top"><b><Icon name="Package" size={14}/> {o.id}</b><b>{o.status}</b></div><div className="order-items">{o.items.map(i=><div key={i.product.id}><img src={i.product.photos[0]}/><span>{i.product.name}<small>{i.quantity} item</small></span></div>)}</div><div className="order-bottom"><span>{o.date}</span><strong>{formatPrice(o.total)}</strong></div></article>)}</div></ModalShell>
}
function StoreModal({name,products,onClose,onOpenProduct,onAdd,onFavorite,favorites}) {
  return <ModalShell onClose={onClose} xwide><ModalTitle title={name} onClose={onClose}/><div className="store-head"><span className="eyebrow blue">TOKO</span><p className="muted">{products.length} produk tersedia · ★ 4.8 seller rating</p></div><div className="store-grid"><div className="grid">{products.map(p=><ProductCard key={p.id} product={p} favorite={favorites.includes(p.id)} onFavorite={onFavorite} onAdd={onAdd} onOpen={onOpenProduct} onStore={()=>{}}/>)}</div></div></ModalShell>
}
function Confirmation({orderId,onOrders,onClose}) {
  return <ModalShell onClose={onClose}><div className="center" style={{padding:42}}><div style={{width:64,height:64,borderRadius:'50%',background:'#e2f3ea',color:'#27774e',display:'grid',placeItems:'center',margin:'0 auto 16px'}}><Icon name="Check" size={30}/></div><h2>Pesanan Berhasil Dibuat!</h2><p>Nomor pesanan <b>{orderId}</b></p><p className="muted">Ini simulasi checkout untuk demo. Tidak ada pembayaran nyata yang diproses.</p><div style={{display:'flex',gap:9,justifyContent:'center',marginTop:22}}><Button onClick={onOrders}>Lihat Pesanan</Button><Button variant="secondary" onClick={onClose}>Kembali</Button></div></div></ModalShell>
}
function LogoutModal({onConfirm,onClose}) {
  return <ModalShell onClose={onClose}><div className="center" style={{padding:35}}><Icon name="LogOut" size={36}/><h2>Keluar dari Rewear?</h2><p className="muted">Keranjang dan aktivitas guest tetap aman di perangkat ini.</p><div style={{display:'flex',gap:9,justifyContent:'center',marginTop:20}}><Button variant="secondary" onClick={onClose}>Batal</Button><Button onClick={onConfirm}>Keluar</Button></div></div></ModalShell>
}

/* =========================================================
   APP
   ========================================================= */
function App() {
  useEffect(()=>{
    window.__rewearReactStarted = true;
    const shell = document.getElementById('preview-shell');
    if(shell) shell.style.display = 'none';
  },[]);
  const [products,setProducts]=useState([]);
  const [loading,setLoading]=useState(true);
  const [user,setUser]=useStored('rewear-user',null);
  const accountKey=user?.email?.toLowerCase()||'guest';
  const [cart,setCart]=useStored(`rewear-cart-${accountKey}`,[]);
  const [favorites,setFavorites]=useStored(`rewear-favorites-${accountKey}`,[]);
  const [orders,setOrders]=useStored(`rewear-orders-${accountKey}`,[]);
  const [rooms,setRooms]=useStored(`rewear-chat-${accountKey}`,initialRooms);
  const [category,setCategory]=useState('Semua');
  const [condition,setCondition]=useState('Semua Kondisi');
  const [search,setSearch]=useState('');
  const [sort,setSort]=useState('Terbaru');
  const [modal,setModal]=useState(null);
  const [selectedProduct,setSelectedProduct]=useState(null);
  const [selectedStore,setSelectedStore]=useState(null);
  const [authMode,setAuthMode]=useState('login');
  const [sellerAuth,setSellerAuth]=useState(false);
  const [toast,setToast]=useState('');
  const toastTimer=useRef(null);
  const [sellerProducts,setSellerProducts]=useStored(`rewear-seller-products-${accountKey}`,[]);
  const [authNotice,setAuthNotice]=useState('');
  const [pendingCheckout,setPendingCheckout]=useState(false);
  const topRef=useRef(null);
  const productsRef=useRef(null);
  const flashRef=useRef(null);
  const [logoutConfirm,setLogoutConfirm]=useState(false);

  useEffect(()=>{let active=true;api.getProducts().then(data=>{if(active){setProducts(data);setLoading(false)}});return()=>{active=false}},[]);
  useEffect(()=>()=>{if(toastTimer.current)window.clearTimeout(toastTimer.current)},[]);

  const showToast=useCallback(message=>{
    setToast(message);
    if(toastTimer.current)window.clearTimeout(toastTimer.current);
    toastTimer.current=window.setTimeout(()=>setToast(''),2400);
  },[]);

  const unread=useMemo(()=>rooms.reduce((n,r)=>n+r.messages.filter(m=>m.sender==='other'&&!m.read).length,0),[rooms]);
  const allProducts=useMemo(()=>[...products,...sellerProducts],[products,sellerProducts]);
  const filtered=useMemo(()=>{
    const q=search.trim().toLowerCase();
    return allProducts
      .filter(p=>category==='Semua'||p.category===category)
      .filter(p=>condition==='Semua Kondisi'||p.condition===condition)
      .filter(p=>!q||`${p.brand} ${p.name} ${p.category} ${p.storeName}`.toLowerCase().includes(q))
      .sort((a,b)=>sort==='Harga Terendah'?a.price-b.price:sort==='Harga Tertinggi'?b.price-a.price:b.id-a.id);
  },[allProducts,category,condition,search,sort]);

  const subtotal=cart.reduce((s,x)=>s+x.product.price*x.quantity,0);
  const cartCount=cart.reduce((s,x)=>s+x.quantity,0);

  const addToCart=product=>{
    if(product.stock<=0){showToast('Item ini sudah terjual');return}
    setCart(current=>{
      const found=current.find(x=>x.product.id===product.id);
      if(found) return current.map(x=>x.product.id===product.id?{...x,quantity:Math.min(product.stock,x.quantity+1)}:x);
      return [...current,{product,quantity:1}];
    });
    showToast(`${product.name} masuk ke keranjang`);
  };
  const changeQty=(id,amount)=>setCart(current=>current.flatMap(x=>x.product.id===id?[{...x,quantity:Math.max(0,Math.min(x.product.stock,x.quantity+amount))}].filter(y=>y.quantity>0):[x]));
  const removeCart=id=>setCart(c=>c.filter(x=>x.product.id!==id));
  const toggleFavorite=id=>setFavorites(c=>c.includes(id)?c.filter(x=>x!==id):[...c,id]);

  const openAuth=(seller=false,mode='login')=>{setSellerAuth(seller);setAuthMode(mode);setModal('auth')};
  const login=u=>{
    const guestCart=readStorage('rewear-cart-guest',[]);
    const guestFavorites=readStorage('rewear-favorites-guest',[]);
    const nextKey=u.email?.toLowerCase()||'guest';
    const accountCart=readStorage(`rewear-cart-${nextKey}`,[]);
    const accountFavorites=readStorage(`rewear-favorites-${nextKey}`,[]);
    const mergedCart=[...accountCart];
    guestCart.forEach(item=>{const existing=mergedCart.find(x=>x.product?.id===item.product?.id);if(!existing)mergedCart.push(item)});
    const mergedFavorites=[...new Set([...accountFavorites,...guestFavorites])];
    try{localStorage.setItem(`rewear-cart-${nextKey}`,JSON.stringify(mergedCart));localStorage.setItem(`rewear-favorites-${nextKey}`,JSON.stringify(mergedFavorites));localStorage.removeItem('rewear-cart-guest');localStorage.removeItem('rewear-favorites-guest')}catch{}
    setUser(u);setAuthNotice('');setModal(pendingCheckout?'checkout':null);setPendingCheckout(false);showToast(`Selamat datang, ${u.name}`);
  };
  const startCheckout=()=>{ if(!cart.length){showToast('Keranjang masih kosong');return;} if(!user){setPendingCheckout(true);setAuthNotice('Silakan masuk atau daftar untuk menyelesaikan checkout.');setSellerAuth(false);setAuthMode('login');setModal('auth');return;} setAuthNotice('');setModal('checkout'); };
  const saveSellerProduct=p=>setSellerProducts(current=>{const exists=current.some(x=>x.id===p.id);return exists?current.map(x=>x.id===p.id?p:x):[...current,p]});
  const placeOrder=({shipping,payment,address})=>{
    const order={id:`RW-${Date.now().toString().slice(-6)}`,date:new Date().toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}),items:cart,total:subtotal+shipping,status:'Diproses',address:address.detail,payment};
    setOrders(o=>[order,...o]);const purchasedIds=new Set(cart.map(i=>i.product.id));setProducts(ps=>ps.map(p=>purchasedIds.has(p.id)?{...p,stock:0,isSold:true,sold:p.sold+cart.find(i=>i.product.id===p.id).quantity}:p));setSellerProducts(ps=>ps.map(p=>purchasedIds.has(p.id)?{...p,stock:0,isSold:true,sold:p.sold+cart.find(i=>i.product.id===p.id).quantity}:p));setCart([]);setModal('confirmation');showToast('Pesanan berhasil dibuat');
  };

  const modalContent=()=>{
    if(modal==='auth')return <AuthModal sellerMode={sellerAuth} setSellerMode={setSellerAuth} mode={authMode} setMode={setAuthMode} onClose={()=>setModal(null)} onLogin={login} notice={authNotice}/>;
    if(modal==='product'&&selectedProduct)return <ProductModal product={selectedProduct} onClose={()=>setModal(null)} onAdd={addToCart} favorite={favorites.includes(selectedProduct.id)} onFavorite={toggleFavorite} onStore={name=>{setSelectedStore(name);setModal('store')}}/>;
    if(modal==='cart')return <CartModal cart={cart} subtotal={subtotal} onChangeQty={changeQty} onRemove={removeCart} onCheckout={startCheckout} onClose={()=>setModal(null)}/>;
    if(modal==='checkout')return <CheckoutPage cart={cart} subtotal={subtotal} onPlaceOrder={placeOrder} onBack={()=>setModal('cart')}/>;
    if(modal==='chat')return <ChatModal rooms={rooms} setRooms={setRooms} onClose={()=>setModal(null)} onRead={()=>{}}/>;
    if(modal==='orders')return <OrdersModal orders={orders} onClose={()=>setModal(null)}/>;
    if(modal==='store'&&selectedStore)return <StoreModal name={selectedStore} products={allProducts.filter(p=>p.storeName===selectedStore)} favorites={favorites} onFavorite={toggleFavorite} onAdd={addToCart} onClose={()=>setModal(null)} onOpenProduct={p=>{setSelectedProduct(p);setModal('product')}}/>;
    if(modal==='seller')return <SellerDashboard products={sellerProducts} user={user} onClose={()=>setModal(null)} onSaveProduct={saveSellerProduct}/>;
    if(modal==='confirmation')return <Confirmation orderId={orders[0]?.id||'RW-DEMO'} onOrders={()=>setModal('orders')} onClose={()=>setModal(null)}/>;
    if(modal==='logout')return <LogoutModal onClose={()=>setModal(null)} onConfirm={()=>{setUser(null);setModal(null);showToast('Kamu sudah keluar')}}/>;
    return null;
  };

  return <div ref={topRef}>
    <Header user={user} cartCount={cartCount} chatUnread={unread} search={search} setSearch={setSearch}
      onOpenCart={()=>setModal('cart')} onOpenChat={()=>setModal('chat')} onOpenAuth={openAuth}
      onOpenOrders={()=>setModal('orders')} onNavigate={key=>{const target=key==='top'?topRef:key==='flash'?flashRef:productsRef;target.current?.scrollIntoView({behavior:'smooth',block:'start'})}} onOpenSeller={()=>user?setModal('seller'):openAuth(true,'login')}
      onLogout={()=>setModal('logout')}/>
    <div className="announcement"><div className="container announcement-inner"><Icon name="Sparkles" size={15}/><b>GRATIS ONGKIR</b><span>Belanja preloved, hemat sampai 80%!</span><button onClick={()=>productsRef.current?.scrollIntoView({behavior:'smooth',block:'start'})}>Belanja Sekarang <Icon name="ArrowRight" size={13}/></button></div></div>

    <main className="container page">
      <section className="category-bar"><div className="section-head" style={{marginBottom:0}}><strong>Kategori</strong><button className="store-link" onClick={()=>setCategory('Semua')}>Lihat Semua →</button></div><div className="category-list">{categories.map((x,i)=><button className={`category-pill ${category===x?'active':''}`} key={x} onClick={()=>setCategory(x)}><span>{['🛍️','👚','👗','🧥','👖','👜','👟','✨','🧒','🏃'][i]}</span>{x}</button>)}</div></section>

      <section className="hero" style={{backgroundImage:`linear-gradient(90deg,rgba(58,9,16,.9),rgba(74,20,32,.3)),url(${images.hero})`}}>
        <div><span className="eyebrow blue">PRELOVED TERPERCAYA</span><h1>Fashion branded,<br/>harga bersahabat.</h1><p>Diskon hingga 80% dari harga asli</p><Button onClick={()=>productsRef.current?.scrollIntoView({behavior:'smooth',block:'start'})}>Lihat Semua <Icon name="ArrowRight" size={15}/></Button></div>
      </section>

      <section className="section flash" id="flash-sale" ref={flashRef}>
        <div className="section-head"><div><h2>⚡ Flash Sale</h2><p className="muted">Harga spesial untuk item pilihan · stok sangat terbatas</p></div><Countdown/></div>
        {loading?<SkeletonGrid/>:<div className="grid">{products.filter(p=>p.isFlashSale).map(p=><ProductCard key={p.id} product={p} flash favorite={favorites.includes(p.id)} onFavorite={toggleFavorite} onAdd={addToCart} onOpen={x=>{setSelectedProduct(x);setModal('product')}} onStore={x=>{setSelectedStore(x);setModal('store')}}/>)}</div>}
      </section>

      <section className="trust"><div className="trust-item"><span className="trust-icon"><Icon name="Leaf"/></span><span><b>Eco-Conscious</b><br/><small>Belanja lebih berkelanjutan</small></span></div><div className="trust-item"><span className="trust-icon"><Icon name="BadgeCheck"/></span><span><b>Item dicek tim kami</b><br/><small>Kondisi diverifikasi</small></span></div><div className="trust-item"><span className="trust-icon"><Icon name="Eye"/></span><span><b>12.400+ item dilihat</b><br/><small>Marketplace aktif</small></span></div><div className="trust-item"><span className="trust-icon"><Icon name="RotateCcw"/></span><span><b>Retur 14 hari</b><br/><small>Sesuai kebijakan toko</small></span></div></section>

      <section className="section" id="products" ref={productsRef}>
        <div className="section-head"><div><h2>Semua Produk</h2><p className="muted">{loading?'Memuat produk…':`${filtered.length} produk ditemukan`} · Dikirim ke <b>Jakarta Selatan</b></p></div><select value={sort} onChange={e=>setSort(e.target.value)} style={{border:'1px solid var(--line)',borderRadius:8,padding:'9px 12px',background:'#fff'}}><option>Terbaru</option><option>Harga Terendah</option><option>Harga Tertinggi</option></select></div>
        <div className="category-list" style={{marginBottom:16}}>{conditions.map(x=><button className={`condition-pill ${condition===x?'active':''}`} key={x} onClick={()=>setCondition(x)}>{x}</button>)}</div>
        {loading?<SkeletonGrid/>:filtered.length===0?<div className="empty" style={{background:'#fff',border:'1px solid var(--line)',borderRadius:16}}><Icon name="SearchX" size={45}/><h2>Produk tidak ditemukan</h2><p>Coba kata kunci, kategori, atau kondisi yang berbeda.</p><Button variant="secondary" onClick={()=>{setSearch('');setCategory('Semua');setCondition('Semua Kondisi')}}>Reset Pencarian</Button></div>:<div className="grid">{filtered.map(p=><ProductCard key={p.id} product={p} favorite={favorites.includes(p.id)} onFavorite={toggleFavorite} onAdd={addToCart} onOpen={x=>{setSelectedProduct(x);setModal('product')}} onStore={x=>{setSelectedStore(x);setModal('store')}}/>)}</div>}
      </section>

      <section className="sell"><img src={images.floral} alt="Fashion preloved"/><div className="sell-copy"><span className="eyebrow blue">JUAL BAJU KAMU</span><h2>Lemari penuh? Jual di sini!</h2><p>Upload produk, kelola stok satuan, edit listing, dan lihat penjualan dari Seller Mode.</p><Button onClick={()=>user?setModal('seller'):openAuth(true,'login')}>Masuk sebagai Seller <Icon name="ArrowRight" size={15}/></Button></div></section>
    </main>

    <footer className="footer"><div className="container footer-grid"><div><button className="footer-logo">RE<span>•</span>WEAR</button><p style={{color:'#cfc3c5'}}>Fashion preloved terpercaya<br/>untuk semua.</p></div>{[['Belanja',['Semua Produk','Flash Sale','Baru Masuk','Kategori']],['Jual',['Cara Jual','Panduan Penjual','Harga & Komisi']],['Bantuan',['FAQ','Cara Beli','Retur & Refund','Hubungi Kami']],['Tentang',['Tentang Rewear','Keberlanjutan','Karir','Blog']]].map(([t,items])=><div key={t}><b>{t}</b>{items.map(x=><button key={x}>{x}</button>)}</div>)}</div><div className="container copyright"><span>© 2026 Rewear · Preloved fashion untuk semua</span><span>Privasi · Syarat & Ketentuan</span></div></footer>
    <Toast message={toast}/>{modal&&modalContent()}
  </div>
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
